{% extends 'base.html' %}
{% load i18n %}

{% block title %}تنظیمات پروفایل | پلتفرم خودرو{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-md mt-10">
    <div class="flex justify-between items-center mb-8 border-b pb-4 dark:border-gray-700">
        <h2 class="text-2xl font-bold text-gray-800 dark:text-white">تنظیمات حساب کاربری</h2>
        <a href="{% url 'dashboard' %}" class="text-sm text-gray-500 hover:text-primary transition">بازگشت به پنل</a>
    </div>

    <form method="post" class="space-y-6">
        {% csrf_token %}

        <!-- نام کاربری (فقط خواندنی) -->
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">نام کاربری (غیرقابل تغییر)</label>
            <input type="text" value="{{ user.username }}" disabled class="w-full px-4 py-2 border border-gray-200 dark:border-gray-700 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-500 cursor-not-allowed">
        </div>

        {% for field in form %}
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}
                <p class="text-xs text-red-500 mt-1">{{ error }}</p>
            {% endfor %}
        </div>
        {% endfor %}

        <div class="pt-4 border-t border-gray-100 dark:border-gray-700">
            <button type="submit" class="w-full bg-primary hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow-md">
                ذخیره تغییرات
            </button>
        </div>
    </form>
</div>
{% endblock %}
