{% extends 'base.html' %}
{% load i18n %}

{% block title %}گزارش آگهی | پلتفرم خودرو{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-md mt-10">
    <h2 class="text-2xl font-bold text-red-500 mb-2 text-center">گزارش تخلف آگهی</h2>
    <p class="text-center text-sm text-gray-500 dark:text-gray-400 mb-8">آگهی: <strong class="text-gray-800 dark:text-white">{{ car.title }}</strong></p>

    <form method="post" class="space-y-6">
        {% csrf_token %}
        {% for field in form %}
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">{{ field.label }}</label>
            {{ field }}
        </div>
        {% endfor %}

        <div class="flex gap-3 pt-4">
            <button type="submit" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-3 rounded-xl transition shadow-md">ثبت گزارش</button>
            <a href="{% url 'car_detail' car.pk %}" class="flex-1 text-center bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-300 font-medium py-3 rounded-xl transition">انصراف</a>
        </div>
    </form>
</div>
{% endblock %}
