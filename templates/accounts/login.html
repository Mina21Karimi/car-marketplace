{% extends 'base.html' %} {% block title %}ورود | پلتفرم خودرو{% endblock %}
{%block content %}
<div
  class="max-w-md mx-auto bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-md mt-10"
>
  <h2 class="text-2xl font-bold text-center text-gray-800 dark:text-white mb-6">
    ورود به حساب کاربری
  </h2>
  <form method="post" class="space-y-4">
    {% csrf_token %}

    <!-- فیلد نام کاربری -->
    <div>
      <label
        class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
        >نام کاربری:</label
      >
      <input
        type="text"
        name="username"
        class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-primary focus:border-primary dark:bg-gray-700 dark:text-white"
        required
      />
    </div>

    <!-- فیلد رمز عبور -->
    <div>
      <label
        class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
        >رمز عبور:</label
      >
      <input
        type="password"
        name="password"
        class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-primary focus:border-primary dark:bg-gray-700 dark:text-white"
        required
      />
    </div>

    <!-- نمایش خطاها (مثلاً اگر رمز اشتباه باشد) -->
    {% if form.errors %}
    <div
      class="bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 p-3 rounded-lg text-sm"
    >
      نام کاربری یا رمز عبور اشتباه است.
    </div>
    {% endif %}

    <button
      type="submit"
      class="w-full bg-primary hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition mt-4"
    >
      ورود
    </button>
  </form>
  <p class="text-center text-sm text-gray-600 dark:text-gray-400 mt-6">
    حساب کاربری ندارید؟
    <a
      href="{% url 'register' %}"
      class="text-primary hover:underline font-medium"
      >ثبت‌نام کنید</a
    >
  </p>
</div>
{% endblock %}
